<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tải MP3 TikTok</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--text-muted:#94a3b8;--c-primary:#8b5cf6;--c-secondary:#ec4899;--c-accent:#06b6d4;--ok:#10b981;--err:#f43f5e}
*{box-sizing:border-box}
body{margin:0;color:#f8fafc;font:14.5px/1.6 "Be Vietnam Pro",system-ui,sans-serif;min-height:100vh;background-color:#090a0f;background-image:radial-gradient(circle at 15% 30%,rgba(139,92,246,.15),transparent 40%),radial-gradient(circle at 85% 70%,rgba(236,72,153,.12),transparent 40%);background-attachment:fixed}
main{max-width:640px;margin:0 auto;padding:60px 20px}
h1{font-size:clamp(28px,6vw,44px);line-height:1.15;font-weight:800;margin:0 0 12px;text-align:center}
.sub{color:var(--text-muted);text-align:center;margin:0 0 30px}
.card{background:rgba(17,19,31,.65);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:24px}
input{width:100%;background:rgba(0,0,0,.3);color:#f8fafc;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;font:inherit}
input:focus-visible{outline:none;border-color:var(--c-accent);box-shadow:0 0 0 4px rgba(6,182,212,.2)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.btn{flex:1;background:linear-gradient(135deg,var(--c-primary),var(--c-secondary));color:#fff;border:0;border-radius:12px;padding:12px 20px;font:600 14px "Be Vietnam Pro",system-ui,sans-serif;cursor:pointer}
.btn.sec{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.btn:disabled{opacity:.6;cursor:wait}
#msg{margin-top:16px;color:var(--text-muted);min-height:1.6em;overflow-wrap:anywhere}
#msg.ok{color:var(--ok)}#msg.err{color:var(--err)}
#msg a{color:var(--c-accent)}
</style>
</head>
<body>
<main>
<h1>Tải MP3 từ link TikTok</h1>
<p class="sub">Dán link video, tải xong trang tự chuyển sang Sky Studio để xử lý.</p>
<form class="card" id="f" autocomplete="off">
  <input id="url" type="url" inputmode="url" required placeholder="https://www.tiktok.com/@user/video/…">
  <div class="row">
    <button type="button" class="btn sec" id="paste">Dán link</button>
    <button type="submit" class="btn" id="go">Tải MP3</button>
  </div>
  <div id="msg" role="status"></div>
</form>
</main>
<script>
const $=s=>document.querySelector(s);
const API='https://www.tikwm.com/api/';
const absUrl=u=>!u?'':u.startsWith('//')?'https:'+u:u.startsWith('/')?'https://www.tikwm.com'+u:u;
const say=(t,c='',html)=>{const m=$('#msg');m.className=c;html?m.innerHTML=t:m.textContent=t};

$('#paste').onclick=async()=>{try{const t=await navigator.clipboard.readText();if(t)$('#url').value=t.trim()}catch(e){say('Trình duyệt không cho đọc clipboard, hãy dán thủ công.','err')}};

/* Lưu file vào IndexedDB để app.html (cùng trang web) lấy ra */
function handoff(blob,name){
  return new Promise((res,rej)=>{
    const q=indexedDB.open('sky-handoff',1);
    q.onupgradeneeded=()=>q.result.createObjectStore('f');
    q.onerror=()=>rej(q.error);
    q.onsuccess=()=>{
      const tx=q.result.transaction('f','readwrite');
      tx.objectStore('f').put({blob,name},'pending');
      tx.oncomplete=res;tx.onerror=()=>rej(tx.error);
    };
  });
}

$('#f').addEventListener('submit',async e=>{
  e.preventDefault();
  const link=$('#url').value.trim(),go=$('#go');
  if(!/tiktok\.com/i.test(link)){say('Link không hợp lệ: hãy dán link từ tiktok.com hoặc vm.tiktok.com','err');return}
  go.disabled=true;
  try{
    say('Đang lấy thông tin video…');
    const res=await fetch(API+'?url='+encodeURIComponent(link));
    if(!res.ok)throw new Error('API trả về lỗi '+res.status);
    const j=await res.json();
    if(j.code!==0||!j.data)throw new Error(j.msg||'Không lấy được dữ liệu video');
    const d=j.data,inf=d.music_info||{},mp3=absUrl(d.music||inf.play);
    if(!mp3)throw new Error('Video này không có file nhạc để tải.');
    const title=(inf.title||d.title||'tiktok-audio').replace(/[\\/:*?"<>|#\n\r]+/g,' ').replace(/\s+/g,' ').trim().slice(0,80)||'tiktok-audio';
    say('Đang tải MP3…');
    let blob;
    try{const r=await fetch(mp3);if(!r.ok)throw 0;blob=await r.blob()}
    catch(_){say('Nguồn MP3 không cho tải trực tiếp. <a href="'+mp3+'" target="_blank" rel="noopener">Mở MP3</a> để lưu thủ công, rồi vào <a href="app.html">Sky Studio</a> thả file vào.','err',true);return}
    await handoff(blob,title+'.mp3');
    say('Tải xong ('+(blob.size/1048576).toFixed(2)+' MB), đang chuyển sang Sky Studio…','ok');
    location.href='app.html';
  }catch(err){
    let m=String(err.message||err);
    if(/limit/i.test(m))m='Dịch vụ đang giới hạn số lượt gọi, đợi vài giây rồi thử lại.';
    else if(/Failed to fetch|NetworkError/i.test(m))m='Không kết nối được tới máy chủ lấy dữ liệu, hãy kiểm tra mạng.';
    say('Lỗi: '+m,'err');
  }finally{go.disabled=false}
});
</script>
</body>
</html>
