<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky Studio · TikTok/MP3 → Sky</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{font:15px/1.5 system-ui,sans-serif;max-width:720px;margin:0 auto;padding:16px;background:#0b0c10;color:#e5e7eb}
h1{font-size:22px;margin:0 0 8px}h2{font-size:16px;margin:0 0 8px}
section{border:1px solid #2a2d38;background:#12141b;border-radius:8px;padding:12px;margin:12px 0}
label{display:block;margin:8px 0;font-size:13px;color:#9ca3af}
input,select{display:block;width:100%;padding:8px;font:inherit;background:#000;color:#e5e7eb;border:1px solid #2a2d38;border-radius:6px}
input[type=checkbox]{display:inline;width:auto;margin-right:6px}
button{min-height:44px;padding:8px 14px;font:inherit;cursor:pointer;background:#1e222d;color:#e5e7eb;border:1px solid #333847;border-radius:6px}
button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #06b6d4;outline-offset:2px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 12px}
#bar{height:8px;background:#000;border-radius:4px;overflow:hidden;margin:8px 0}#bar i{display:block;height:100%;width:0;background:#06b6d4;transition:width .4s}
#log{height:120px;overflow:auto;background:#050608;border:1px solid #2a2d38;padding:8px;font:12px/1.6 ui-monospace,monospace}
.ok{color:#34d399}.err{color:#f87171}.wr{color:#fbbf24}
#rep{color:#9ca3af}#rep b{color:#06b6d4}[hidden]{display:none!important}
#rb{overflow-x:auto;background:#050608;border:1px solid #2a2d38;margin-top:8px}#roll{display:block}
</style></head><body>
<h1>Sky Studio</h1>
<section>
  <h2>1. Nguồn nhạc (bot xử lý, không tốn RAM trình duyệt)</h2>
  <label>Link TikTok<input id="tt" type="url" placeholder="https://www.tiktok.com/@user/video/…"></label>
  <label>Hoặc chọn file (MP3, MP4, WAV, M4A… hoặc MIDI)<input id="file" type="file"></label>
  <div class="g">
    <label>Nhạc cụ<select id="inst"><option value="piano">Piano</option><option value="guitar">Guitar</option></select></label>
    <label>Lọc kick, bass, nhiễu<select id="filt"><option value="mid">Vừa</option><option value="hard">Mạnh</option><option value="off">Tắt</option></select></label>
  </div>
  <label><input type="checkbox" id="center">Khử âm ở giữa (giảm giọng hát, kick, bass; chỉ hợp file stereo, có thể làm mất nhạc cụ đặt giữa)</label>
  <details><summary>Địa chỉ bot</summary><label>URL bot (để trống nếu trang này do chính bot phục vụ)<input id="bot" placeholder="http://botmusic.wispbyte.app:16891"></label></details>
  <p><button id="go">Bắt đầu</button></p>
  <div id="bar"><i></i></div><div id="log" role="log" aria-live="polite"></div>
</section>
<section id="opt" hidden>
  <h2>2. Tùy chỉnh Sky</h2>
  <div class="g">
    <label>Tên bài<input id="name"></label><label>Tác giả<input id="author"></label><label>Người chuyển soạn<input id="by"></label>
    <label>Dịch tông (nửa cung)<select id="tr"><option value="auto">Tự động</option></select></label>
    <label>Dịch quãng tám<select id="oct"><option value="auto">Tự động</option><option>-2</option><option>-1</option><option>0</option><option>1</option><option>2</option></select></label>
    <label>Nốt không có trong 15 phím<select id="acc"><option value="follow">Theo giai điệu</option><option value="down">Hạ xuống</option><option value="up">Nâng lên</option></select></label>
    <label>Tối đa nốt cùng lúc<select id="poly"><option>1</option><option>2</option><option>3</option><option>4</option><option>6</option><option>8</option><option selected>10</option></select></label>
    <label>BPM game (trống = tự dò)<input id="bpmfix" type="number" min="30" max="2000" step="any"></label>
    <label>Sai số cho phép (ms)<input id="tol" type="number" value="35" min="0" step="any"></label>
    <label>BPM tối đa<input id="maxbpm" type="number" value="1000" min="60" max="2000"></label>
  </div>
</section>
<section id="out" hidden>
  <h2>3. Kết quả</h2><p id="stats"></p>
  <div id="rb"><canvas id="roll" height="150" aria-label="Piano roll"></canvas></div><div id="rep"></div>
  <p><button id="bTxt">Tải .txt (UTF-16)</button> <button id="bJson">Tải .json</button> <button id="bMid" hidden>Tải MIDI</button></p>
</section>
<script>
const $=s=>document.querySelector(s),SC=[0,2,4,5,7,9,11];
let notes=[],song=null,midiBlob=null,fname='bai-nhac';
const log=(m,c='')=>{const d=document.createElement('div');d.className=c;d.textContent=m;$('#log').append(d);$('#log').scrollTop=1e9};
const bar=p=>$('#bar i').style.width=p+'%';
try{$('#bot').value=localStorage.skybot||''}catch(e){}
const BOT=()=>{const v=$('#bot').value.trim().replace(/\/$/,'');try{localStorage.skybot=v}catch(e){}return v||location.origin};
for(let t=-11;t<=11;t++){const o=document.createElement('option');o.value=t;o.textContent=(t>0?'+':'')+t;$('#tr').append(o)}

/* ---- gọi bot ---- */
async function api(p,o){const r=await fetch(BOT()+p,o),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Lỗi '+r.status));return j}
async function viaBot(){
  const f=$('#file').files[0],q='inst='+$('#inst').value+'&filt='+$('#filt').value+'&center='+($('#center').checked?1:0);
  let r;
  if($('#tt').value.trim()){log('Bot đang tải MP3 từ TikTok…');r=await api('/api/tiktok',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('#tt').value.trim(),inst:$('#inst').value,filt:$('#filt').value,center:$('#center').checked})})}
  else{log('Gửi '+f.name+' ('+(f.size/1048576).toFixed(1)+' MB) lên bot…');r=await api('/api/jobs?'+q+'&name='+encodeURIComponent(f.name),{method:'POST',body:f})}
  let last='';
  for(;;){
    await new Promise(r=>setTimeout(r,1500));
    const s=await api('/api/jobs/'+r.id);bar(s.pct);if(s.msg!==last){last=s.msg;log(s.msg,s.stage==='error'?'err':'')}
    if(s.stage==='error')throw new Error(s.error);
    if(s.stage==='done'){fname=(s.name||fname).replace(/\.[^.]+$/,'');const m=await fetch(BOT()+'/api/jobs/'+r.id+'/midi');return await m.arrayBuffer()}
  }
}
/* ---- đọc MIDI (tempo map, ghép Note Off theo hàng đợi từng phím) ---- */
function parseMidi(buf){
  const d=new DataView(buf);let p=0;const str=n=>{let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(d.getUint8(p++));return s};
  if(str(4)!=='MThd')throw new Error('Không phải file MIDI');p+=6;const nt=d.getUint16(p);p+=2;const div=d.getUint16(p);p+=2;
  if(div&0x8000)throw new Error('MIDI dùng nhịp SMPTE, chưa hỗ trợ');
  const tempos=[],raw=[];
  for(let t=0;t<nt&&p+8<=d.byteLength;t++){
    const id=str(4),len=d.getUint32(p);p+=4;const end=Math.min(p+len,d.byteLength);if(id!=='MTrk'){p=end;continue}
    let tick=0,rs=0;const act=new Map(),vl=()=>{let v=0,b;do{b=d.getUint8(p++);v=v*128+(b&127)}while(b&128&&p<end);return v};
    try{while(p<end){tick+=vl();let s=d.getUint8(p);
      if(s===0xFF){p++;const ty=d.getUint8(p++),l=vl();if(ty===0x51&&l===3)tempos.push({tick,us:(d.getUint8(p)<<16)|(d.getUint8(p+1)<<8)|d.getUint8(p+2)});p+=l;rs=0}
      else if(s===0xF0||s===0xF7){p++;p+=vl();rs=0}
      else{if(s&128){rs=s;p++}else s=rs;const hi=s>>4,ch=s&15;
        if(hi===9||hi===8){const n=d.getUint8(p++),v=d.getUint8(p++),k=ch*128+n;
          if(ch!==9){if(hi===9&&v>0){const o={n,v,s:tick,e:null},q=act.get(k)||[];raw.push(o);q.push(o);act.set(k,q)}else{const q=act.get(k);if(q&&q.length)q.shift().e=tick}}}
        else if(hi===0xC||hi===0xD)p++;else p+=2}}}catch(e){}
    p=end;for(const o of raw)if(o.e==null)o.e=tick;
  }
  tempos.sort((a,b)=>a.tick-b.tick);
  const T=tick=>{let ms=0,lt=0,us=500000;for(const t of tempos){if(t.tick>=tick)break;ms+=(t.tick-lt)*us/1000/div;lt=t.tick;us=t.us}return ms+(tick-lt)*us/1000/div};
  return raw.map(o=>({n:o.n,s:T(o.s),e:Math.max(T(o.e),T(o.s)+30)})).sort((a,b)=>a.s-b.s);
}
/* ---- quy đổi 15 phím ---- */
const fold=m=>{let k=0;while(m<60){m+=12;k++}while(m>84){m-=12;k++}return{m,k}};
const keyIdx=m=>Math.floor((m-60)/12)*7+SC.indexOf(m%12);
function evalB(bpm,on){
  const L=60000/bpm;let c=0,s=0;for(const o of on){const a=o.t/L*2*Math.PI;c+=Math.cos(a);s+=Math.sin(a)}
  let t0=Math.atan2(s,c)/(2*Math.PI)*L,lo=1e9,hi=-1e9;
  for(const o of on){const x=(o.t-t0)/L,e=(x-Math.round(x))*L;if(e<lo)lo=e;if(e>hi)hi=e}
  t0+=(lo+hi)/2;let col=0,pr=NaN;for(const o of on){const r=Math.round((o.t-t0)/L);if(r===pr)col++;pr=r}
  return{bpm,L,t0,mx:(hi-lo)/2,col};
}
function convert(){
  if(!notes.length){song=null;show();return}
  const rng=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i),shS=$('#tr').value,ocS=$('#oct').value,hist=new Array(128).fill(0);
  for(const n of notes)hist[n.n]++;
  let bc=Infinity,sh=0,oc=0;
  for(const a of shS==='auto'?rng(-11,11):[+shS])for(const o of ocS==='auto'?rng(-3,3):[+ocS]){
    let c=0;for(let p=0;p<128;p++)if(hist[p]){const f=fold(p+a+12*o);c+=hist[p]*(3*f.k+(SC.includes(f.m%12)?0:1))}
    c+=.01*Math.abs(a)+.0001*Math.abs(o);if(c<bc){bc=c;sh=a;oc=o}
  }
  const S=sh+12*oc,acc=$('#acc').value,poly=+$('#poly').value;let prev=null,nAcc=0,nOct=0;
  const pts=notes.map(n=>{const f=fold(n.n+S);let k;
    if(SC.includes(f.m%12))k=keyIdx(f.m);else{const lo=keyIdx(f.m-1),hi=keyIdx(f.m+1);k=acc==='down'?lo:acc==='up'?hi:prev==null?lo:(Math.abs(hi-prev)<Math.abs(lo-prev)?hi:lo);nAcc++}
    if(f.k)nOct++;prev=k;return{t:n.s,k}});
  const on=[];for(const p of pts){const o=on[on.length-1];if(o&&p.t-o.t<=15)o.l.push(p);else on.push({t:p.t,l:[p]})}
  const manual=parseFloat($('#bpmfix').value)||0,tol=Math.max(.01,parseFloat($('#tol').value)||0),maxB=Math.max(30,parseFloat($('#maxbpm').value)||1000);
  let G;
  if(manual>0)G=evalB(manual,on);
  else{const cs=rng(30,Math.floor(maxB)).map(b=>evalB(b,on)).filter(x=>x.col===0);G=cs.find(x=>x.mx<=tol);
    if(!G&&cs.length){const m=Math.min(...cs.map(x=>x.mx));G=cs.find(x=>x.mx<=m*1.05+1e-9)}if(!G)G=evalB(maxB,on)}
  const L=G.L,out=[];let last=-1e9,c0=null,pushed=0,drop=0;
  for(const o of on){
    const x=(o.t-G.t0)/L;let c=Math.round(x);if(c<=last){c=last+1;pushed++}last=c;if(c0===null)c0=c;
    const ks=[...new Set(o.l.map(p=>p.k))].sort((a,b)=>b-a);drop+=Math.max(0,ks.length-poly);
    for(const k of ks.slice(0,poly).sort((a,b)=>a-b))out.push({time:Math.ceil((c-c0+4)*L)+1,key:'1Key'+k});
  }
  song={name:$('#name').value,author:$('#author').value,transcribedBy:$('#by').value,isComposed:true,bpm:G.bpm,bitsPerPage:16,pitchLevel:0,isEncrypted:false,songNotes:out};
  const N=notes.length,R=(t,v)=>t+': <b>'+v+'</b>';
  song._rep='<b>Báo cáo</b><br>'+[R('Tổng nốt',N),R('Nốt Sky',out.length),R('BPM game / 1 ô',G.bpm+' / '+L.toFixed(2)+' ms'),R('Lệch thời gian tối đa',G.mx.toFixed(2)+' ms'),
    R('Dịch toàn bài',(sh>0?'+':'')+sh+' nửa cung, '+(oc>0?'+':'')+oc+' quãng tám'),R('Thăng/giáng xê nửa cung',nAcc+' ('+(nAcc/N*100).toFixed(1)+'%)'),R('Gập quãng tám',nOct),R('Bỏ vì vượt '+poly+' nốt',drop),R('Đẩy sang ô kế',pushed)].join('<br>');
  show();
}
const toJSON=()=>{const o={...song};delete o._rep;return JSON.stringify([o])};
function show(){
  $('#out').hidden=!song;if(!song)return;
  const n=song.songNotes,dur=n.length?(n[n.length-1].time-n[0].time)/1000:0;
  $('#stats').textContent=n.length+' nốt · '+Math.floor(dur/60)+':'+String(Math.floor(dur%60)).padStart(2,'0')+' · BPM '+song.bpm;$('#rep').innerHTML=song._rep;
  const cv=$('#roll'),end=n.length?n[n.length-1].time:1,sc=Math.min(.05,6000/end);cv.width=Math.ceil(end*sc)+8;cv.height=150;
  const x=cv.getContext('2d');x.fillStyle='#050608';x.fillRect(0,0,cv.width,150);x.fillStyle='#06b6d4';
  for(const a of n)x.fillRect(a.time*sc,(14-+a.key.slice(4))*10+1,2,8);
}
/* ---- xuất file ---- */
const dl=(name,blob)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
const safe=()=>($('#name').value||fname).replace(/[\\/:*?"<>|]+/g,'_');
$('#bTxt').onclick=()=>{const s=toJSON(),u=new Uint16Array(s.length+1);u[0]=0xFEFF;for(let i=0;i<s.length;i++)u[i+1]=s.charCodeAt(i);dl(safe()+'.txt',new Blob([u],{type:'text/plain'}))};
$('#bJson').onclick=()=>dl(safe()+'.json',new Blob([toJSON()],{type:'application/json'}));
$('#bMid').onclick=()=>midiBlob&&dl(safe()+'.mid',midiBlob);
['#tr','#oct','#acc','#poly','#bpmfix','#tol','#maxbpm'].forEach(s=>$(s).addEventListener('change',()=>{if(notes.length)convert()}));
['#name','#author','#by'].forEach(s=>$(s).addEventListener('input',()=>{if(song){song.name=$('#name').value;song.author=$('#author').value;song.transcribedBy=$('#by').value}}));
/* ---- chạy ---- */
$('#go').onclick=async()=>{
  const f=$('#file').files[0],tt=$('#tt').value.trim();
  if(!tt&&!f){log('Hãy dán link TikTok hoặc chọn file.','wr');return}
  $('#go').disabled=true;$('#log').innerHTML='';bar(0);song=null;show();
  try{
    let buf;
    if(!tt&&f&&/\.(mid|midi)$/i.test(f.name)){buf=await f.arrayBuffer();fname=f.name.replace(/\.[^.]+$/,'');$('#tol').value=0;log('File MIDI: đọc trực tiếp, không cần bot.')}
    else{buf=await viaBot();$('#tol').value=35}
    midiBlob=new Blob([buf],{type:'audio/midi'});$('#bMid').hidden=false;
    notes=parseMidi(buf);if(!notes.length)throw new Error('Không có nốt nào');
    log('Nhận '+notes.length+' nốt, đang quy đổi sang 15 phím Sky…','ok');
    $('#name').value=fname;$('#opt').hidden=false;convert();bar(100);log('Hoàn tất','ok');
  }catch(e){log('Lỗi: '+(e.message||e),'err')}
  finally{$('#go').disabled=false}
};
log('Sẵn sàng.');
</script></body></html>
