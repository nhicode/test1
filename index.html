<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tải MP3 TikTok</title>
<style>
:root{color-scheme:dark}
body{font:15px/1.6 system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;color:#e5e7eb;background:#0b0c10}
input{width:100%;padding:8px;font:inherit;box-sizing:border-box;background:#000;color:#e5e7eb;border:1px solid #2a2d38}
button{padding:8px 14px;font:inherit;cursor:pointer;background:#1e222d;color:#e5e7eb;border:1px solid #333847;border-radius:6px}
button:disabled{opacity:.6;cursor:wait}
a{color:#06b6d4}
#msg{min-height:1.6em;overflow-wrap:anywhere;color:#9ca3af}
#msg.ok{color:#34d399}#msg.err{color:#f87171}
#saved{border-top:1px solid #2a2d38;margin-top:20px;padding-top:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>Tải MP3 từ link TikTok</h1>
<p>Dán link video. Tải xong trang tự chuyển sang Sky Studio để xử lý.</p>
<form id="f" autocomplete="off">
  <p><label>Nhạc cụ trong video: <select id="inst"><option value="piano">Piano</option><option value="guitar">Guitar</option></select></label>
  <label>Lọc nhạc nền/trống/bass: <select id="filt"><option value="mid">Vừa</option><option value="hard">Mạnh</option><option value="off">Tắt</option></select></label></p>
  <input id="url" type="url" inputmode="url" required placeholder="https://www.tiktok.com/@user/video/…">
  <p><button type="button" id="paste">Dán link</button> <button type="submit" id="go">Tải MP3</button></p>
  <div id="msg" role="status"></div>
</form>
<div id="saved" hidden>
  <p>Bài đang giữ (MIDI): <b id="sn"></b></p>
  <button type="button" id="open">Mở lại</button> <button type="button" id="del">Xóa</button>
</div>
<script>
const $=s=>document.querySelector(s);
const API='https://www.tikwm.com/api/';
const absUrl=u=>!u?'':u.startsWith('//')?'https:'+u:u.startsWith('/')?'https://www.tikwm.com'+u:u;
const say=(t,c='',html)=>{const m=$('#msg');m.className=c;html?m.innerHTML=t:m.textContent=t};

/* IndexedDB dùng chung với app.html: 'pending' = MP3 chờ xử lý, 'midi' = bài đã nhận dạng */
const DB=()=>new Promise((res,rej)=>{const q=indexedDB.open('sky-handoff',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const dbGet=async k=>{const d=await DB();return new Promise(r=>{const g=d.transaction('f').objectStore('f').get(k);g.onsuccess=()=>r(g.result);g.onerror=()=>r()})};
const dbPut=async(k,v)=>{const d=await DB();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const dbDel=async(...ks)=>{const d=await DB();return new Promise(res=>{const t=d.transaction('f','readwrite');ks.forEach(k=>t.objectStore('f').delete(k));t.oncomplete=res;t.onerror=res})};

async function showSaved(){
  try{
    const m=await dbGet('midi'),p=await dbGet('pending'),x=p||m;
    $('#saved').hidden=!x;
    if(x)$('#sn').textContent=x.name+(p?' (MP3 chưa xử lý xong)':'');
  }catch(e){$('#saved').hidden=true}
}
$('#open').onclick=()=>{location.href='app.html'};
$('#del').onclick=async()=>{await dbDel('pending','midi');showSaved();say('Đã xóa bài đang giữ.')};
showSaved();

$('#paste').onclick=async()=>{try{const t=await navigator.clipboard.readText();if(t)$('#url').value=t.trim()}catch(e){say('Trình duyệt không cho đọc clipboard, hãy dán thủ công.','err')}};

$('#f').addEventListener('submit',async e=>{
  e.preventDefault();
  const link=$('#url').value.trim(),go=$('#go');
  if(!/tiktok\.com/i.test(link)){say('Link không hợp lệ: hãy dán link từ tiktok.com hoặc vm.tiktok.com','err');return}
  go.disabled=true;
  try{
    say('Đang lấy thông tin video…');
    const res=await fetch(API+'?url='+encodeURIComponent(link));
    if(!res.ok)throw new Error('API trả về lỗi '+res.status);
    const j=await res.json();
    if(j.code!==0||!j.data)throw new Error(j.msg||'Không lấy được dữ liệu video');
    const d=j.data,inf=d.music_info||{},mp3=absUrl(d.music||inf.play);
    if(!mp3)throw new Error('Video này không có file nhạc để tải.');
    const title=(inf.title||d.title||'tiktok-audio').replace(/[\\/:*?"<>|#\n\r]+/g,' ').replace(/\s+/g,' ').trim().slice(0,80)||'tiktok-audio';
    say('Đang tải MP3…');
    let blob;
    try{const r=await fetch(mp3);if(!r.ok)throw 0;blob=await r.blob()}
    catch(_){say('Nguồn MP3 không cho tải trực tiếp. <a href="'+mp3+'" target="_blank" rel="noopener">Mở MP3</a> để lưu thủ công, rồi vào <a href="app.html">Sky Studio</a> thả file vào.','err',true);return}
    await dbDel('midi'); /* tải bài mới thì xóa bài cũ */
    await dbPut('pending',{blob,name:title+'.mp3',inst:$('#inst').value,filt:$('#filt').value});
    say('Tải xong ('+(blob.size/1048576).toFixed(2)+' MB), đang chuyển sang Sky Studio…','ok');
    location.href='app.html';
  }catch(err){
    let m=String(err.message||err);
    if(/limit/i.test(m))m='Dịch vụ đang giới hạn số lượt gọi, đợi vài giây rồi thử lại.';
    else if(/Failed to fetch|NetworkError/i.test(m))m='Không kết nối được tới máy chủ lấy dữ liệu, hãy kiểm tra mạng.';
    say('Lỗi: '+m,'err');
  }finally{go.disabled=false}
});
</script>
</body>
</html>
