<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIDI → Sky Studio</title>
<style>
:root{color-scheme:dark;--bg:#0b0c10;--pn:#12141b;--ln:#2a2d38;--tx:#e5e7eb;--mu:#9ca3af;--ac:#06b6d4}
*{box-sizing:border-box}
body{font:15px/1.5 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:16px;color:var(--tx);background:var(--bg)}
h1{font-size:22px;margin:0 0 12px}h2{font-size:16px;margin:0 0 8px}
section{border:1px solid var(--ln);background:var(--pn);padding:12px;margin:12px 0;border-radius:8px}
label{display:block;margin:8px 0;font-size:13px;color:var(--mu)}
input[type=text],input[type=number],select,textarea{display:block;width:100%;padding:8px;font:inherit;background:#000;color:var(--tx);border:1px solid var(--ln);border-radius:6px}
textarea{height:120px;font:12px ui-monospace,monospace}
button{min-height:44px;padding:8px 14px;font:inherit;cursor:pointer;background:#1e222d;color:var(--tx);border:1px solid #333847;border-radius:6px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
#dz{display:block;border:2px dashed #4b5563;padding:28px 12px;text-align:center;cursor:pointer;color:var(--tx);font-size:15px}
#dz span{color:var(--mu);font-size:13px}
#drop.on #dz{border-color:var(--ac)}
#log{height:140px;overflow:auto;background:#050608;border:1px solid var(--ln);padding:8px;font:12px/1.6 ui-monospace,monospace;margin-top:8px}
.ok{color:#34d399}.err{color:#f87171}.wr{color:#fbbf24}
.pt{display:block;color:var(--tx)}.pt small{display:block;margin-left:24px;color:var(--mu)}
#rollbox{overflow-x:auto;border:1px solid var(--ln);background:#050608;margin-top:8px}#roll{display:block}
#rep{color:var(--mu);margin-top:8px}#rep b{color:var(--ac)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>MIDI → Sky Studio</h1>

<section id="drop">
  <label id="dz" for="file"><b>Chọn hoặc kéo file vào đây</b><br><span>MIDI (.mid) · hoặc âm thanh piano (MP3, WAV, M4A…)</span></label>
  <input id="file" type="file" hidden>
  <div id="log" role="log" aria-live="polite"></div>
</section>

<section id="opts" hidden>
  <h2>Track và tùy chỉnh</h2>
  <div id="parts"></div>
  <div class="grid">
    <label>Tên bài hát<input id="name" type="text"></label>
    <label>Ca sĩ / Tác giả<input id="author" type="text"></label>
    <label>Người chuyển soạn<input id="by" type="text"></label>
    <label>Dịch tông (nửa cung)<select id="tr"><option value="auto">Tự động (khớp nhiều nốt nhất)</option></select></label>
    <label>Dịch quãng tám<select id="oct"><option value="auto">Tự động</option><option>-2</option><option>-1</option><option>0</option><option>1</option><option>2</option></select></label>
    <label>Nốt không có trong 15 phím<select id="acc"><option value="follow">Theo giai điệu</option><option value="down">Hạ xuống</option><option value="up">Nâng lên</option></select></label>
    <label>Tối đa nốt đánh cùng lúc<select id="poly"><option>1</option><option>2</option><option>3</option><option>4</option><option>6</option><option>8</option><option selected>10</option></select></label>
    <label>Nốt vượt giới hạn<select id="over"><option value="60">Rải lệch tối đa 60 ms (không mất nốt)</option><option value="30">Rải lệch tối đa 30 ms</option><option value="0">Bỏ nốt ưu tiên thấp</option></select></label>
    <label>Khoảng cách tối thiểu 2 lần bấm cùng phím (ms, 0 = tắt)<input id="gap" type="number" value="0" min="0" max="300" step="any"></label>
  </div>
</section>

<section id="res" hidden>
  <h2>Kết quả</h2>
  <div class="row">
    <button id="bSky">▶ Nghe bản Sky</button>
    <button id="bOrig">▶ Nghe MIDI gốc</button>
    <button id="bStop">■ Dừng</button>
  </div>
  <p id="stats"></p>
  <div id="rollbox"><canvas id="roll" height="150" aria-label="Piano roll"></canvas></div>
  <div id="rep"></div>
  <div class="row">
    <button id="bTxt">Tải .txt (UTF-16)</button>
    <button id="bJson">Tải .json</button>
    <button id="bCopy">Sao chép JSON</button>
  </div>
  <details><summary>Xem JSON</summary><textarea id="json" readonly></textarea></details>
</section>

<script>
const $=s=>document.querySelector(s);
const SC=[0,2,4,5,7,9,11],NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const CKPT='https://storage.googleapis.com/magentadata/js/checkpoints/transcription/onsets_frames_uni';
const MM='https://cdn.jsdelivr.net/npm/@magenta/music@1.23.1',TONE='https://cdn.jsdelivr.net/npm/tone@15.1.22/build/Tone.js';
const SAL='https://tonejs.github.io/audio/salamander/';
let parts=[],song=null,fname='bai-nhac',bpm0=120,model=null,sampler=null,part=null,tk=0;
const T0=performance.now();

function log(m,c=''){
  const L=$('#log'),d=document.createElement('div');
  d.className=c;d.textContent=((performance.now()-T0)/1000).toFixed(1)+'s  '+m;
  L.appendChild(d);L.scrollTop=L.scrollHeight;
}
const loadScript=u=>new Promise((res,rej)=>{const e=document.createElement('script');e.src=u;e.onload=res;e.onerror=()=>rej(new Error('Không tải được '+u));document.head.appendChild(e)});
const pn=p=>NN[p%12]+(Math.floor(p/12)-1);
const keyMidi=i=>60+12*Math.floor(i/7)+SC[i%7];
const keyIdx=m=>Math.floor((m-60)/12)*7+SC.indexOf(m%12);
function fold(m){let k=0;while(m<60){m+=12;k++}while(m>84){m-=12;k++}return{m,k}}

/* ---------- Đọc MIDI: tempo map, program, kênh trống; Note Off ghép theo hàng đợi từng phím ---------- */
function parseMidi(buf){
  const d=new DataView(buf);let p=0;
  const str=n=>{let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(d.getUint8(p++));return s};
  if(str(4)!=='MThd')throw new Error('Đây không phải file MIDI hợp lệ.');
  p+=6;const nt=d.getUint16(p);p+=2;const div=d.getUint16(p);p+=2;
  if(div&0x8000)throw new Error('MIDI dùng nhịp SMPTE, chưa được hỗ trợ.');
  const tempos=[],prog=Array.from({length:16},()=>[]),raw=[];let errs=0,maxTick=0;
  while(raw.length<nt&&p+8<=d.byteLength){
    const id=str(4),len=d.getUint32(p);p+=4;const end=Math.min(p+len,d.byteLength);
    if(id!=='MTrk'){p=end;continue}
    const notes=[],act=new Map();let tick=0,rs=0,name='';
    const vl=()=>{let v=0,b;do{b=d.getUint8(p++);v=v*128+(b&127)}while(b&128&&p<end);return v};
    try{while(p<end){
      tick+=vl();let s=d.getUint8(p);
      if(s===0xFF){
        p++;const ty=d.getUint8(p++),l=vl();
        if(ty===0x51&&l===3)tempos.push({tick,us:(d.getUint8(p)<<16)|(d.getUint8(p+1)<<8)|d.getUint8(p+2)});
        if(ty===0x03){name='';for(let i=0;i<l;i++)name+=String.fromCharCode(d.getUint8(p+i))}
        p+=l;rs=0;
      }else if(s===0xF0||s===0xF7){p++;p+=vl();rs=0}
      else{
        if(s&128){rs=s;p++}else s=rs;
        if(!s)throw new Error('running status');
        const hi=s>>4,ch=s&15;
        if(hi===9||hi===8){
          const n=d.getUint8(p++),v=d.getUint8(p++),k=ch*128+n;
          if(hi===9&&v>0){const o={ch,n,v,s:tick,e:null},q=act.get(k)||[];notes.push(o);q.push(o);act.set(k,q)}
          else{const q=act.get(k);if(q&&q.length)q.shift().e=tick;else errs++}
        }else if(hi===0xC)prog[ch].push({tick,v:d.getUint8(p++)});
        else if(hi===0xD)p++;else p+=2;
      }
    }}catch(e){errs++}
    p=end;
    for(const o of notes){if(o.e==null)o.e=tick;if(o.e<=o.s)o.e=o.s+Math.max(1,Math.round(div/8))}
    maxTick=Math.max(maxTick,tick);
    raw.push({name:name||('Track '+(raw.length+1)),notes});
  }
  tempos.sort((a,b)=>a.tick-b.tick);prog.forEach(a=>a.sort((x,y)=>x.tick-y.tick));
  const tks=[0],ms=[0],us=[500000];
  for(const t of tempos){
    const L=tks.length-1;
    if(t.tick===tks[L]){us[L]=t.us;continue}
    ms.push(ms[L]+(t.tick-tks[L])*us[L]/1000/div);tks.push(t.tick);us.push(t.us);
  }
  const T=tick=>{let lo=0,hi=tks.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(tks[m]<=tick)lo=m;else hi=m-1}return ms[lo]+(tick-tks[lo])*us[lo]/1000/div};
  const pgAt=(ch,t)=>{const a=prog[ch];let lo=0,hi=a.length-1,r=-1;while(lo<=hi){const m=(lo+hi)>>1;if(a[m].tick<=t){r=m;lo=m+1}else hi=m-1}return r<0?0:a[r].v};
  const map=new Map();
  raw.forEach((tr,ti)=>{for(const n of tr.notes){
    const pg=pgAt(n.ch,n.s),perc=n.ch===9,bass=!perc&&pg>=32&&pg<40,key=ti+':'+n.ch+':'+(perc?'P':bass?'B':'N');
    let P=map.get(key);
    if(!P)map.set(key,P={tr:ti,ch:n.ch,perc,bass,label:perc?'Trống/Percussion':bass?'Bass':'Program '+pg,name:tr.name,notes:[]});
    P.notes.push({n:n.n,v:n.v,s:T(n.s),e:T(n.e)});
  }});
  let best=0,bd=-1;
  for(let i=0;i<us.length;i++){const dd=(i+1<us.length?ms[i+1]:T(maxTick))-ms[i];if(dd>bd){bd=dd;best=us[i]}}
  return{parts:[...map.values()].sort((a,b)=>a.tr-b.tr||a.ch-b.ch),bpm:6e7/best,errs};
}

/* ---------- Âm thanh → nốt piano (Magenta Onsets and Frames) ---------- */
async function fromAudio(f){
  if(!window.mm)await loadScript(MM);
  if(!model){log('Tải mô hình nhận dạng piano (chỉ lần đầu, vài chục MB)…');model=new mm.OnsetsAndFrames(CKPT);await model.initialize();log('Mô hình đã sẵn sàng','ok')}
  log('Nhận dạng nốt piano, có thể mất vài phút…');
  const ns=await model.transcribeFromAudioFile(f);
  if(!ns.notes.length)throw new Error('Không phát hiện nốt piano nào trong file.');
  return{parts:[{tr:0,ch:0,perc:false,bass:false,label:'Piano nhận dạng',name:f.name,
    notes:ns.notes.map(n=>({n:n.pitch,v:n.velocity||80,s:(n.startTime||0)*1000,e:n.endTime*1000}))}],bpm:60,errs:0};
}

/* ---------- Danh sách track ---------- */
function drawParts(){
  const el=$('#parts');el.innerHTML='';
  const on=parts.map(P=>!P.perc&&!P.bass);
  if(!on.some(Boolean)){let b=0;parts.forEach((P,i)=>{if(P.notes.length>parts[b].notes.length)b=i});on[b]=true}
  parts.forEach((P,i)=>{
    const l=document.createElement('label'),c=document.createElement('input'),b=document.createElement('b'),s=document.createElement('small');
    l.className='pt';c.type='checkbox';c.id='p'+i;c.checked=on[i];
    b.textContent=' Track '+(P.tr+1)+' · ch '+(P.ch+1)+' — '+P.label+' — '+P.notes.length.toLocaleString('en-US')+' nốt';
    const ps=P.notes.map(n=>n.n);
    s.textContent=P.name+' · '+pn(Math.min(...ps))+'–'+pn(Math.max(...ps));
    l.append(c,b,s);el.appendChild(l);
  });
}

/* ---------- Quy đổi sang 15 phím Sky ---------- */
const pri=n=>n.v*128+n.n;
function gapFix(notes,g){
  const by=new Map();let moved=0,mx=0;
  for(const n of notes){let q=by.get(n.key);if(!q)by.set(n.key,q=[]);q.push(n)}
  for(const q of by.values()){
    q.sort((x,y)=>x.time-y.time);
    for(let i=1;i<q.length;i++){const need=q[i-1].time+g;if(q[i].time<need){mx=Math.max(mx,need-q[i].time);q[i].time=Math.ceil(need);moved++}}
  }
  return{moved,mx};
}
function run(){
  const sel=parts.filter((P,i)=>$('#p'+i)&&$('#p'+i).checked),all=sel.flatMap(P=>P.notes.map(n=>({...n})));
  stop();
  if(!all.length){song=null;show();return}
  const poly=+$('#poly').value,stag=+$('#over').value,g=parseFloat($('#gap').value)||0,acc=$('#acc').value;
  const hist=new Array(128).fill(0);for(const n of all)hist[n.n]++;
  const rng=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i),shS=$('#tr').value,ocS=$('#oct').value;
  let bc=Infinity,sh=0,oc=0;
  for(const a of shS==='auto'?rng(-11,11):[+shS])for(const o of ocS==='auto'?rng(-3,3):[+ocS]){
    let c=0;
    for(let p=0;p<128;p++)if(hist[p]){const f=fold(p+a+12*o);c+=hist[p]*(3*f.k+(SC.includes(f.m%12)?0:1))}
    c+=.01*Math.abs(a)+.0001*Math.abs(o);
    if(c<bc){bc=c;sh=a;oc=o}
  }
  const S=sh+12*oc,ev=all.sort((a,b)=>a.s-b.s||a.n-b.n),base=ev[0].s;
  let prev=null;
  for(const n of ev){
    const f=fold(n.n+S);n.m=f.m;
    if(SC.includes(f.m%12)){n.key=keyIdx(f.m);n.t=f.k?'oct':'exact'}
    else{
      const lo=keyIdx(f.m-1),hi=keyIdx(f.m+1);
      n.key=acc==='down'?lo:acc==='up'?hi:prev==null?lo:(Math.abs(hi-prev)<Math.abs(lo-prev)?hi:lo);n.t='acc';
    }
    prev=n.key;
  }
  const cl=[];
  for(const n of ev){const c=cl[cl.length-1];if(c&&n.s-c.t<=15)c.l.push(n);else cl.push({t:n.s,l:[n]})}
  const cnt={exact:0,acc:0,oct:0,dup:0,drop:0,stag:0},out=[];
  for(const c of cl){
    const m=new Map();
    for(const n of c.l){const q=m.get(n.key);cnt.dup+=q?1:0;if(!q||pri(n)>pri(q))m.set(n.key,n)}
    [...m.values()].sort((a,b)=>pri(b)-pri(a)).forEach((n,i)=>{
      const gr=Math.floor(i/poly),d=gr*20;
      if(d>stag){cnt.drop++;return}
      if(gr)cnt.stag++;
      cnt[n.t]++;out.push({time:Math.round(n.s-base+500+d),key:'1Key'+n.key});
    });
  }
  const gf=g>0?gapFix(out,g):{moved:0,mx:0};
  out.sort((a,b)=>a.time-b.time||(+a.key.slice(4))-(+b.key.slice(4)));
  const N=all.length,kept=out.length,pc=x=>(x/N*100).toFixed(1)+'%',R=(t,v)=>t+': <b>'+v+'</b>';
  song={name:$('#name').value,author:$('#author').value,transcribedBy:$('#by').value,isComposed:true,bpm:Math.round(bpm0),bitsPerPage:16,pitchLevel:0,isEncrypted:false,songNotes:out};
  song._rep='<b>Báo cáo chuyển đổi</b><br>'+[
    R('Tổng nốt đã chọn',N),R('Nốt Sky xuất ra',kept),
    R('Dịch toàn bài',(sh>0?'+':'')+sh+' nửa cung, '+(oc>0?'+':'')+oc+' quãng tám'),
    R('Giữ nguyên cao độ',cnt.exact+' ('+pc(cnt.exact)+')'),
    R('Gập quãng tám (ngoài 15 phím)',cnt.oct+' ('+pc(cnt.oct)+')'),
    R('Thăng/giáng phải xê nửa cung',cnt.acc+' ('+pc(cnt.acc)+')'),
    R('Trùng phím cùng lúc (gộp)',cnt.dup),
    R('Rải lệch thay vì bỏ (vượt '+poly+' nốt)',cnt.stag),R('Bỏ vì vượt giới hạn',cnt.drop),
    R('Giãn nốt cùng phím quá sát',gf.moved+(gf.moved?' (dời tối đa '+gf.mx.toFixed(1)+' ms)':'')),
    R('Sai lệch thời gian',cnt.stag||gf.moved?'0 ms với phần lớn nốt, trừ nốt rải/giãn ở trên':'0 ms (chỉ làm tròn 1 ms)')].join('<br>');
  if(cnt.drop)log('Bỏ '+cnt.drop+' nốt vì vượt giới hạn nốt cùng lúc','wr');
  if(cnt.acc/N>.1)log(cnt.acc+' nốt ('+pc(cnt.acc)+') phải xê nửa cung: 15 phím không có nốt thăng/giáng','wr');
  log('Hoàn tất: '+kept+' nốt Sky','ok');
  show();
}

/* ---------- Hiển thị, piano roll, xuất file ---------- */
const toJSON=()=>{const o={...song};delete o._rep;return JSON.stringify([o])};
function show(){
  $('#res').hidden=!song;if(!song)return;
  const n=song.songNotes,dur=n.length?(n[n.length-1].time-n[0].time)/1000:0;
  $('#stats').textContent=n.length+' nốt · '+Math.floor(dur/60)+':'+String(Math.floor(dur%60)).padStart(2,'0')+' · BPM ghi chú '+song.bpm;
  $('#json').value=toJSON();$('#rep').innerHTML=song._rep;
  const cv=$('#roll'),end=n.length?n[n.length-1].time:1,sc=Math.min(.05,6000/end);
  cv.width=Math.ceil(end*sc)+8;cv.height=150;
  const x=cv.getContext('2d');if(!x)return;
  x.fillStyle='#050608';x.fillRect(0,0,cv.width,150);x.fillStyle='#06b6d4';
  for(const a of n)x.fillRect(a.time*sc,(14-+a.key.slice(4))*10+1,2,8);
}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const safe=()=>($('#name').value||fname).replace(/[\\/:*?"<>|]+/g,'_');
$('#bTxt').onclick=()=>{
  const s=toJSON(),u=new Uint16Array(s.length+1);u[0]=0xFEFF;
  for(let i=0;i<s.length;i++)u[i+1]=s.charCodeAt(i);
  download(safe()+'.txt',new Blob([u],{type:'text/plain'}));
};
$('#bJson').onclick=()=>download(safe()+'.json',new Blob([toJSON()],{type:'application/json'}));
$('#bCopy').onclick=async()=>{
  try{await navigator.clipboard.writeText(toJSON());$('#bCopy').textContent='Đã sao chép'}catch(e){$('#json').select();document.execCommand('copy')}
  setTimeout(()=>$('#bCopy').textContent='Sao chép JSON',1500);
};

/* ---------- Nghe thử: bản Sky và MIDI gốc (đúng cao độ gốc) để so sánh ---------- */
async function inst(){
  if(!window.Tone)await loadScript(TONE);
  await Tone.start();
  if(sampler)return sampler;
  try{
    sampler=await new Promise((res,rej)=>{
      const u={};['A1','C2','A2','C3','A3','C4','A4','C5','A5','C6','A6','C7'].forEach(k=>u[k]=k+'.mp3');
      const s=new Tone.Sampler({urls:u,baseUrl:SAL,release:1,onload:()=>res(s),onerror:rej}).toDestination();
      setTimeout(()=>rej(new Error('quá thời gian')),20000);
    });
  }catch(e){
    log('Không tải được âm piano mẫu, dùng âm tổng hợp','wr');
    sampler=new Tone.PolySynth(Tone.Synth,{envelope:{attack:.005,decay:.3,sustain:.1,release:.6}}).toDestination();
  }
  return sampler;
}
function stop(){
  tk++;
  if(window.Tone){try{Tone.Transport.stop();Tone.Transport.cancel(0)}catch(e){}}
  if(part){try{part.dispose()}catch(e){}part=null}
  if(sampler){try{sampler.releaseAll()}catch(e){}}
}
async function play(ev){
  if(!ev.length)return;stop();const my=tk;
  let s;try{s=await inst()}catch(e){log('Không phát được: '+(e.message||e),'err');return}
  if(my!==tk)return;
  const t0=ev[0].time,dur=Math.max(...ev.map(e=>e.time-t0+e.d));
  part=new Tone.Part((t,e)=>s.triggerAttackRelease(Tone.Frequency(e.m,'midi').toNote(),e.d,t,.8),ev.map(e=>({...e,time:e.time-t0}))).start(0);
  Tone.Transport.start('+0.1');
  setTimeout(()=>{if(my===tk)stop()},(dur+1)*1000);
}
$('#bSky').onclick=()=>song&&play(song.songNotes.map(n=>({time:n.time/1000,m:keyMidi(+n.key.slice(4)),d:.6})));
$('#bOrig').onclick=()=>play(parts.filter((P,i)=>$('#p'+i).checked).flatMap(P=>P.notes.map(n=>({time:n.s/1000,m:n.n,d:Math.min(4,Math.max(.08,(n.e-n.s)/1000))}))).sort((a,b)=>a.time-b.time));
$('#bStop').onclick=stop;

/* ---------- Nhập file: tự động chuyển ngay khi chọn ---------- */
async function load(f){
  if(!f)return;stop();song=null;show();$('#log').innerHTML='';$('#opts').hidden=true;
  fname=f.name.replace(/\.[^.]+$/,'');
  log('Nhận file: '+f.name+' ('+(f.size/1048576).toFixed(2)+' MB)');
  try{
    const buf=await f.arrayBuffer(),isMidi=String.fromCharCode(...new Uint8Array(buf.slice(0,4)))==='MThd';
    const r=isMidi?parseMidi(buf):await fromAudio(f);
    parts=r.parts;bpm0=r.bpm;
    if(!parts.length||!parts.some(P=>P.notes.length))throw new Error('Không tìm thấy nốt nhạc nào.');
    if(r.errs)log('Bỏ qua '+r.errs+' sự kiện MIDI lỗi','wr');
    log('Đọc được '+parts.length+' track, '+parts.reduce((a,P)=>a+P.notes.length,0)+' nốt','ok');
    $('#name').value=fname;drawParts();$('#opts').hidden=false;run();
  }catch(e){log('Lỗi: '+(e.message||e),'err')}
}
for(let t=-11;t<=11;t++){const o=document.createElement('option');o.value=t;o.textContent=(t>0?'+':'')+t;$('#tr').appendChild(o)}
const drop=$('#drop'),fi=$('#file');
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',ev=>load(ev.dataTransfer.files[0]));
fi.onchange=()=>{load(fi.files[0]);fi.value=''};
['#poly','#over','#gap','#tr','#oct','#acc'].forEach(s=>$(s).addEventListener('change',()=>{if(parts.length)run()}));
$('#parts').addEventListener('change',()=>run());
['#name','#author','#by'].forEach(s=>$(s).addEventListener('input',()=>{
  if(!song)return;song.name=$('#name').value;song.author=$('#author').value;song.transcribedBy=$('#by').value;$('#json').value=toJSON();
}));
log('Sẵn sàng. Chọn một file để bắt đầu.');
</script>
