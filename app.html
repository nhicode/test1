<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MP3 → MIDI</title>
<script>window.TONE_SILENCE_LOGGING=true</script>
<script src="https://cdn.jsdelivr.net/npm/@magenta/music@1.23.1"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@15.1.22/build/Tone.js"></script>
<style>
:root{color-scheme:dark}
body{font:15px/1.5 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:16px;color:#e5e7eb;background:#0b0c10}
h1{font-size:24px;margin:0 0 8px}h2{font-size:17px;margin:0 0 8px}
section{border:1px solid #2a2d38;background:#12141b;padding:12px;margin:12px 0}
label{display:block;margin:6px 0;font-size:13px;color:#9ca3af}
input[type=text],input[type=number],select,textarea{display:block;width:100%;padding:6px;font:inherit;box-sizing:border-box;background:#000;color:#e5e7eb;border:1px solid #2a2d38}
input[type=file]{color:#9ca3af}
input[type=checkbox]{margin-right:6px}
button{padding:8px 14px;font:inherit;cursor:pointer;background:#1e222d;color:#e5e7eb;border:1px solid #333847;border-radius:6px}
#log{height:200px;overflow:auto;background:#050608;border:1px solid #2a2d38;padding:8px;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;margin-top:10px}
#log time{color:#64748b;margin-right:8px}#log .ok{color:#34d399}#log .err{color:#f87171}#log .wr{color:#fbbf24}
.ctr{text-align:center}
textarea{height:120px;font:12px ui-monospace,monospace}
#dz{display:block;border:2px dashed #4b5563;background:#0b0c10;padding:28px 12px;margin:12px 0 4px;text-align:center;cursor:pointer;color:#e5e7eb;font-size:15px}
#dz b{display:block;font-size:17px;margin-bottom:4px}#dz span{display:block;color:#9ca3af;font-size:13px;margin-bottom:10px}#dz u{color:#06b6d4}
#drop.on #dz{border-color:#06b6d4;background:#0f1a22}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>MP3 → MIDI (Piano / Guitar)</h1>
<p><button id="bNew">Bài mới</button></p>

<section id="drop">
  <label>Nhạc cụ trong file (chọn trước khi tải file)
    <select id="srcinst"><option value="piano">Piano</option><option value="guitar">Guitar</option></select></label>
  <label>Lọc nhạc nền, trống, bass (kick)
    <select id="filt"><option value="mid">Vừa</option><option value="hard">Mạnh</option><option value="off">Tắt</option></select></label>
  <label id="dz" for="file"><b>Chọn hoặc kéo file vào đây</b><span>MP3, WAV, FLAC, M4A, OGG · MIDI (.mid)</span><u>Bấm để chọn file</u></label>
  <input id="file" type="file" hidden>
</section>

<section>
  <h2>Tiến trình</h2>
  <ol id="steps">
    <li id="s0" data-st="idle"><b>Nhận dạng nốt:</b> <span>Chờ file</span></li>
    <li id="s1" data-st="idle"><b>Sẵn sàng nghe / tải MIDI:</b> <span>Chờ file</span></li>
  </ol>
  <button id="bMid" hidden>Tải MIDI (.mid)</button>
  <div id="log" role="log" aria-live="polite"></div>
</section>

<section id="opts" hidden>
  <label>Tên bài<input id="name" type="text"></label>
  <div id="tracks"></div>
</section>

<section id="mplay" hidden>
  <h2>Nghe MIDI</h2>
  <label>Âm thanh nghe thử <select class="pinst"><option value="piano">Piano</option><option value="guitar">Guitar</option></select></label>
  <div class="ctr"><button id="bMPlay">▶ Phát MIDI</button> <button id="bMStop">■ Dừng</button>
  <p id="mTime">Phát các track đang chọn, đúng cao độ gốc.</p></div>
</section>

<script>
const $=s=>document.querySelector(s);
const CKPT='https://storage.googleapis.com/magentadata/js/checkpoints/transcription/onsets_frames_uni';
let tracks=[],tempos=[],division=480,fileName='bai-nhac',model=null,midiBytes=null,T0=performance.now();

/* ---------- Lưu trữ tạm (IndexedDB dùng chung với index.html) ----------
   'pending' = MP3 chờ xử lý, 'midi' = bài đã nhận dạng. Nhận dạng xong thì xóa MP3, chỉ giữ MIDI. */
const DB=()=>new Promise((res,rej)=>{const q=indexedDB.open('sky-handoff',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const dbGet=async k=>{const d=await DB();return new Promise(r=>{const g=d.transaction('f').objectStore('f').get(k);g.onsuccess=()=>r(g.result);g.onerror=()=>r()})};
const dbPut=async(k,v)=>{const d=await DB();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const dbDel=async(...ks)=>{const d=await DB();return new Promise(res=>{const t=d.transaction('f','readwrite');ks.forEach(k=>t.objectStore('f').delete(k));t.oncomplete=res;t.onerror=res})};
$('#bNew').onclick=()=>{stop();location.href='index.html'};

/* ---------- Nhật ký + các bước ---------- */
function log(msg,cls=''){
  const L=$('#log'),s=(performance.now()-T0)/1000,d=document.createElement('div');
  d.className=cls;
  d.innerHTML='<time>'+String(Math.floor(s/60)).padStart(2,'0')+':'+(s%60).toFixed(1).padStart(4,'0')+'</time><span></span>';
  d.lastChild.textContent=msg;L.appendChild(d);L.scrollTop=L.scrollHeight;
}
function step(i,st,txt){const e=$('#s'+i);e.dataset.st=st;if(txt!=null)e.querySelector('span').textContent=({ok:'✔ ',err:'✖ ',run:'… '}[st]||'')+txt}
const frame=()=>new Promise(r=>setTimeout(r,30));

/* ---------- Âm thanh: Tone.js 15.1.22 ---------- */
const SAL='https://tonejs.github.io/audio/salamander/';
const noteName=m=>Tone.Frequency(m,'midi').toNote();
const fmtT=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');
let inst=null,part=null,ui=null,playTk=0;
const INST={
  piano:{base:SAL,keys:['A1','C2','A2','C3','A3','C4','A4','C5','A5','C6','A6','C7'],rel:1},
  guitar:{base:'https://cdn.jsdelivr.net/gh/nbrosowsky/tonejs-instruments@master/samples/guitar-acoustic/',keys:['E2','A2','D3','G3','B3','E4','A4','C5'],rel:.7}
};
const instCache={},pinst=()=>document.querySelector('.pinst').value;
function loadInst(kind){
  if(!INST[kind])kind='piano';
  if(instCache[kind])return instCache[kind];
  return instCache[kind]=(async()=>{
    try{
      log('Tải âm '+kind+' (Tone.js '+Tone.version+')…');
      if(Tone.version!=='15.1.22')log('Cảnh báo: Tone.js đang chạy bản '+Tone.version,'wr');
      const c=INST[kind],smp=await new Promise((res,rej)=>{
        const u={};c.keys.forEach(k=>u[k]=k+'.mp3');
        const sm=new Tone.Sampler({urls:u,baseUrl:c.base,release:c.rel,onload:()=>res(sm),onerror:rej}).toDestination();
        setTimeout(()=>rej(new Error('quá thời gian')),20000);
      });
      log('Âm '+kind+' đã sẵn sàng','ok');return smp;
    }catch(e){
      log('Không tải được âm '+kind+' mẫu ('+(e.message||e)+'), dùng âm tổng hợp','wr');
      const p=new Tone.PolySynth(Tone.Synth,{oscillator:{type:kind==='guitar'?'triangle':'triangle'},envelope:{attack:.005,decay:kind==='guitar'?.5:.3,sustain:.1,release:.6}});
      p.volume.value=-8;return p.toDestination();
    }
  })();
}
function stop(){
  playTk++;clearInterval(ui);ui=null;
  if(window.Tone){try{Tone.Transport.stop();Tone.Transport.cancel(0)}catch(e){}}
  if(part){try{part.dispose()}catch(e){}part=null}
  if(inst){try{inst.releaseAll()}catch(e){}}
}
async function play(events,cb,dur,tick,done){
  stop();const tk=playTk;
  if(!window.Tone){log('Không tải được Tone.js, hãy kiểm tra kết nối internet.','err');return}
  await Tone.start();const s=await loadInst(pinst());if(tk!==playTk)return;
  inst=s;
  part=new Tone.Part((t,e)=>cb(t,e,s),events).start(0);
  Tone.Transport.start('+0.1');
  ui=setInterval(()=>{const el=Tone.Transport.seconds;tick(Math.max(0,el));if(el>dur+.8){stop();done()}},250);
}

/* ---------- Nghe MIDI ---------- */
function midiNotes(){
  const a=[];
  tracks.forEach((t,i)=>{const c=$('#t'+i);if(c&&c.checked)for(const n of t.notes){
    const s=t2ms(n.tick)/1000,e=n.end!=null?t2ms(n.end)/1000:s+.3;
    a.push({s,d:Math.max(.08,Math.min(e-s,4)),p:n.n});
  }});
  return a.sort((x,y)=>x.s-y.s);
}
$('#bMStop').onclick=()=>{stop();$('#mTime').textContent='Đã dừng';log('Đã dừng phát MIDI')};
$('#bMPlay').onclick=()=>{
  const a=midiNotes();if(!a.length)return;
  const t0=a[0].s,ev=a.map(e=>({time:e.s-t0,d:e.d,p:e.p})),dur=Math.max(...ev.map(e=>e.time+e.d));
  play(ev,(t,e,s)=>s.triggerAttackRelease(noteName(e.p),e.d,t,.8),dur,
    el=>{$('#mTime').textContent=fmtT(Math.min(el,dur))+' / '+fmtT(dur)},
    ()=>{$('#mTime').textContent='Phát xong'});
  log('Phát MIDI: '+a.length+' nốt');
};

/* ---------- Đọc MIDI ---------- */
function parseMidi(buf){
  const d=new DataView(buf);let p=0;
  const str=n=>{let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(d.getUint8(p++));return s};
  if(str(4)!=='MThd')throw new Error('Đây không phải file MIDI hợp lệ.');
  p+=4;p+=2;const nt=d.getUint16(p);p+=2;division=d.getUint16(p);p+=2;
  if(division&0x8000)throw new Error('MIDI dùng nhịp SMPTE, chưa được hỗ trợ.');
  tracks=[];tempos=[];
  for(let t=0;t<nt&&p<d.byteLength;t++){
    const id=str(4),len=d.getUint32(p);p+=4;const end=p+len;
    if(id!=='MTrk'){p=end;continue}
    let tick=0,rs=0,name='',notes=[],act={};
    const vl=()=>{let v=0,b;do{b=d.getUint8(p++);v=(v<<7)|(b&127)}while(b&128);return v};
    while(p<end){
      tick+=vl();let s=d.getUint8(p);
      if(s===0xFF){
        p++;const ty=d.getUint8(p++),l=vl();
        if(ty===0x51)tempos.push({tick,us:(d.getUint8(p)<<16)|(d.getUint8(p+1)<<8)|d.getUint8(p+2)});
        if(ty===0x03){name='';for(let i=0;i<l;i++)name+=String.fromCharCode(d.getUint8(p+i))}
        p+=l;
      }else if(s===0xF0||s===0xF7){p++;p+=vl()}
      else{
        if(s&128){rs=s;p++}else s=rs;
        const hi=s>>4,ch=s&15;
        if(hi===9||hi===8){const n=d.getUint8(p++),v=d.getUint8(p++),k=ch*128+n;
          if(ch!==9){const a=act[k];
            if(hi===9&&v>0){if(a)a.end=tick;const o={tick,n,end:null};notes.push(o);act[k]=o}
            else if(a){a.end=tick;delete act[k]}}}
        else if(hi===0xC||hi===0xD)p+=1;else p+=2;
      }
    }
    p=end;
    if(notes.length)tracks.push({name:name||('Track '+(tracks.length+1)),notes});
  }
  tempos.sort((a,b)=>a.tick-b.tick);
  if(!tracks.length)throw new Error('Không tìm thấy nốt nhạc nào (kênh trống bị bỏ qua).');
}
function t2ms(tick){
  let ms=0,lt=0,us=500000;
  for(const t of tempos){if(t.tick>=tick)break;ms+=(t.tick-lt)*us/1000/division;lt=t.tick;us=t.us}
  return ms+(tick-lt)*us/1000/division;
}

/* ---------- Xuất file ---------- */
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const safe=()=>(($('#name').value||fileName).replace(/[\\/:*?"<>|]+/g,'_'));
$('#bMid').onclick=async()=>{
  if(!midiBytes)return;
  const nm=safe(),f=new File([midiBytes],nm+'.mid',{type:'audio/midi'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:f.name});return}catch(e){if(e.name==='AbortError')return}}
  download(nm+'.mid',new Blob([midiBytes],{type:'application/octet-stream'}));log('Đã tải '+nm+'.mid','ok');
};

/* ---------- Nhập file ---------- */
const drop=$('#drop'),fi=$('#file');
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',ev=>load(ev.dataTransfer.files[0]));
fi.onchange=()=>{load(fi.files[0]);fi.value=''};

function showTracks(){
  $('#opts').hidden=false;$('#mplay').hidden=false;
  $('#tracks').innerHTML='<p><b>Chọn track muốn lấy:</b></p>';
  tracks.forEach((t,i)=>{
    const l=document.createElement('label');
    l.innerHTML='<input type="checkbox" id="t'+i+'" checked><span>'+t.name.replace(/</g,'&lt;')+' ('+t.notes.length+' nốt)</span>';
    $('#tracks').appendChild(l);
  });
}
/* ---------- Lọc nhạc nền / trống / bass ---------- */
const FILT={mid:{hp:80,keep:.3,amp:.4,minD:.07},hard:{hp:100,keep:.1,amp:.55,minD:.1}};
function fft(re,im,inv){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
  for(let len=2;len<=n;len<<=1){
    const a=(inv?2:-2)*Math.PI/len,wr=Math.cos(a),wi=Math.sin(a),h=len>>1;
    for(let i=0;i<n;i+=len){let cr=1,ci=0;
      for(let k=0;k<h;k++){
        const u=i+k,v=u+h,xr=re[v]*cr-im[v]*ci,xi=re[v]*ci+im[v]*cr;
        re[v]=re[u]-xr;im[v]=im[u]-xi;re[u]+=xr;im[u]+=xi;
        const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t;
      }}
  }
}
/* tách thành phần "hòa âm" (đàn) khỏi thành phần "xung" (trống, hi-hat, snare) bằng lọc median trên phổ; giữ lại 'keep' phần xung để không mất tiếng gảy/nhấn phím */
function hpss(x,keep){
  const N=1024,H=512,F=N/2+1,T=Math.max(1,Math.ceil((x.length-N)/H)+1),R=8;
  const w=new Float32Array(N);for(let i=0;i<N;i++)w[i]=Math.sqrt(.5-.5*Math.cos(2*Math.PI*i/N));
  const Re=new Float32Array(T*F),Im=new Float32Array(T*F),Mg=new Float32Array(T*F),re=new Float32Array(N),im=new Float32Array(N);
  for(let t=0;t<T;t++){
    for(let i=0;i<N;i++){const p=t*H+i;re[i]=p<x.length?x[p]*w[i]:0;im[i]=0}
    fft(re,im,false);
    for(let k=0;k<F;k++){const q=t*F+k;Re[q]=re[k];Im[q]=im[k];Mg[q]=Math.hypot(re[k],im[k])}
  }
  const tmp=new Float32Array(2*R+1);
  const med=n=>{for(let i=1;i<n;i++){const v=tmp[i];let j=i-1;while(j>=0&&tmp[j]>v){tmp[j+1]=tmp[j];j--}tmp[j+1]=v}return tmp[n>>1]};
  const Hm=new Float32Array(T*F),Pm=new Float32Array(T*F);
  for(let k=0;k<F;k++)for(let t=0;t<T;t++){let n=0;for(let d=-R;d<=R;d++){const tt=t+d;if(tt>=0&&tt<T)tmp[n++]=Mg[tt*F+k]}Hm[t*F+k]=med(n)}
  for(let t=0;t<T;t++)for(let k=0;k<F;k++){let n=0;for(let d=-R;d<=R;d++){const kk=k+d;if(kk>=0&&kk<F)tmp[n++]=Mg[t*F+kk]}Pm[t*F+k]=med(n)}
  const y=new Float32Array(x.length);
  for(let t=0;t<T;t++){
    for(let k=0;k<F;k++){
      const q=t*F+k,h=Hm[q]*Hm[q],p=Pm[q]*Pm[q],mh=h/(h+p+1e-12),g=mh+keep*(1-mh);
      re[k]=Re[q]*g;im[k]=Im[q]*g;
      if(k>0&&k<F-1){re[N-k]=re[k];im[N-k]=-im[k]}
    }
    fft(re,im,true);
    for(let i=0;i<N;i++){const pp=t*H+i;if(pp<y.length)y[pp]+=re[i]/N*w[i]}
  }
  return y;
}
async function hpssAll(x,keep){
  const SEG=22050*40,M=2048,out=new Float32Array(x.length);
  for(let a=0;a<x.length;a+=SEG){
    const s=Math.max(0,a-M),e=Math.min(x.length,a+SEG+M),y=hpss(x.subarray(s,e),keep),n=Math.min(SEG,x.length-a);
    out.set(y.subarray(a-s,a-s+n),a);
    gp=Math.round(Math.min(1,(a+n)/x.length)*100)+'%';await frame();
  }
  gp='';return out;
}
/* giải mã về 22050 Hz mono, cắt bass/kick (lọc thông cao) và tiếng xì hi-hat (lọc thông thấp) */
async function decode22k(buf,hp){
  const AC=window.AudioContext||window.webkitAudioContext,ac=new AC();let ab;
  try{ab=await new Promise((res,rej)=>ac.decodeAudioData(buf.slice(0),res,rej))}finally{try{ac.close()}catch(e){}}
  const off=new OfflineAudioContext(1,Math.ceil(ab.duration*22050),22050),src=off.createBufferSource();
  src.buffer=ab;let n=src;
  if(hp){
    const f1=off.createBiquadFilter(),f2=off.createBiquadFilter(),lp=off.createBiquadFilter();
    f1.type=f2.type='highpass';f1.frequency.value=f2.frequency.value=hp;lp.type='lowpass';lp.frequency.value=5500;
    n.connect(f1);f1.connect(f2);f2.connect(lp);n=lp;
  }
  n.connect(off.destination);src.start();
  return{data:(await off.startRendering()).getChannelData(0),dur:ab.duration};
}
async function cleanAudio(buf,lv){
  const c=FILT[lv];
  const r=await decode22k(buf,c?c.hp:0);
  if(c){log('Lọc trống/hi-hat khỏi âm thanh (mức '+(lv==='hard'?'mạnh':'vừa')+')…');r.data=await hpssAll(r.data,c.keep)}
  return r;
}
function wav16(x,sr){
  const b=new ArrayBuffer(44+x.length*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+x.length*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,x.length*2,true);
  for(let i=0;i<x.length;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,x[i]))*32767,true);
  return new Blob([b],{type:'audio/wav'});
}
/* lọc ở mức nốt: bỏ nốt ngoài tầm đàn (bass/kick), nốt quá ngắn hoặc quá nhỏ, cụm nốt dồn dập trải rộng (trống/nhiễu) */
function cleanNotes(a,kind,lv){
  const c=FILT[lv];if(!c)return a;
  const g6=kind==='guitar',lo=g6?40:36,hi=g6?88:100,mp=g6?6:10;
  a=a.filter(n=>n.p>=lo&&n.p<=hi&&n.e-n.s>=c.minD&&(n.p>=48||n.e-n.s>=.15));
  const md=a.map(n=>n.v).sort((x,y)=>x-y)[a.length>>1]||0;
  a=a.filter(n=>n.v>=c.amp*md||n.e-n.s>=.3).sort((x,y)=>x.s-y.s);
  a=a.filter(n=>!a.some(m=>m!==n&&m.p-n.p===12&&Math.abs(m.s-n.s)<.08&&n.v<.7*m.v)); /* tiếng bass/sub thấp hơn 1 quãng tám, yếu hơn nốt chính */
  const out=[];
  for(let i=0;i<a.length;){
    let j=i;while(j<a.length&&a[j].s-a[i].s<=.04)j++;
    const g=a.slice(i,j);i=j;
    const ps=g.map(n=>n.p),span=Math.max(...ps)-Math.min(...ps),avg=g.reduce((t,n)=>t+n.e-n.s,0)/g.length;
    if(g.length>mp&&span>=20&&avg<.3)continue;
    g.sort((x,y)=>y.v-x.v);out.push(...g.slice(0,mp));
  }
  return out.map(n=>({...n,e:Math.min(n.e,n.s+8)})).sort((x,y)=>x.s-y.s);
}

/* ---------- Nhận dạng guitar: TensorFlow.js 3.21.0 + Basic Pitch 1.0.1 ---------- */
const TFURL='https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js';
const BPMODEL='https://cdn.jsdelivr.net/npm/@spotify/basic-pitch@1.0.1/model/model.json';
let gp='';
const loadScript=u=>new Promise((res,rej)=>{const e=document.createElement('script');e.src=u;e.onload=res;e.onerror=()=>rej(new Error('Không tải được '+u));document.head.appendChild(e)});
async function ensureBP(){
  if(window.BP)return;
  if(!window.tf||!window.tf.version||!/^3\./.test(window.tf.version.tfjs||''))await loadScript(TFURL);
  const e=document.createElement('script');e.text=$('#bpsrc').textContent;document.head.appendChild(e);
  if(!window.BP)throw new Error('Không khởi tạo được bộ nhận dạng guitar.');
}
/* gộp nốt cùng cao độ bị cắt khúc, bỏ họa âm (quãng 8/12/19...) và nốt ngoài tầm đàn guitar */
function guitarNotes(raw){
  const a=raw.filter(n=>n.pitchMidi>=40&&n.pitchMidi<=84).sort((x,y)=>x.startTimeSeconds-y.startTimeSeconds);
  const out=[],last={};
  for(const n of a){
    const s=n.startTimeSeconds,e=s+n.durationSeconds,l=last[n.pitchMidi];
    if(l&&s<=l.end+.06){l.end=Math.max(l.end,e);l.a=Math.max(l.a,n.amplitude);continue}
    const o={s,end:e,p:n.pitchMidi,a:n.amplitude};out.push(o);last[n.pitchMidi]=o;
  }
  const H=[12,19,24,28,31,36];
  return out.filter(n=>!out.some(m=>m!==n&&Math.abs(m.s-n.s)<.08&&H.includes(n.p-m.p)&&m.end-m.s>=n.end-n.s));
}
async function transcribeGuitar(buf,lv){
  log('Tải thư viện nhận dạng guitar (TensorFlow.js + Basic Pitch)…');
  await ensureBP();
  log('Giải mã và đổi âm thanh về 22050 Hz mono…');
  const r=await cleanAudio(buf,lv);
  log('Nhận dạng nốt guitar ('+r.dur.toFixed(1)+' giây). Bước này có thể mất vài phút…');
  const bp=new BP.BasicPitch(BPMODEL),fr=[],on=[];
  await bp.evaluateModel(r.data,(f,o)=>{fr.push(...f);on.push(...o)},p=>{gp=Math.round(p*100)+'%'});
  gp='';
  const g=guitarNotes(BP.noteFramesToTime(BP.outputToNotesPoly(fr,on,.3,.3,9,true,1100,80,true,11)));
  return{notes:g.map(n=>({pitch:n.p,startTime:n.s,endTime:n.end,velocity:Math.max(1,Math.round((n.a||.5)*127))}))};
}
/* dựng lại NoteSequence sau khi lọc (có controlChanges để Magenta ghi được MIDI) */
function finishSeq(ns,kind,lv){
  const arr=ns.notes.map(n=>({p:n.pitch,s:n.startTime||0,e:n.endTime,v:(n.velocity||80)/127}));
  const kept=cleanNotes(arr,kind,lv);
  if(arr.length!==kept.length)log('Đã loại '+(arr.length-kept.length)+'/'+arr.length+' nốt không thuộc '+kind+' (bass, kick, trống, nhiễu)','ok');
  const notes=kept.map(n=>({pitch:n.p,startTime:n.s,endTime:n.e,velocity:Math.max(1,Math.round(n.v*127)),instrument:0,program:kind==='guitar'?25:0}));
  return{notes,controlChanges:[],totalTime:Math.max(0,...notes.map(n=>n.endTime)),ticksPerQuarter:220,tempos:[{time:0,qpm:120}]};
}

async function load(f,inst,filt){
  if(!f)return;stop();midiBytes=null;
  inst=inst||$('#srcinst').value;$('#srcinst').value=inst;filt=filt||$('#filt').value;$('#filt').value=filt;document.querySelectorAll('.pinst').forEach(o=>o.value=inst);if(window.Tone)loadInst(inst);
  T0=performance.now();$('#log').innerHTML='';$('#bMid').hidden=true;$('#opts').hidden=true;$('#mplay').hidden=true;
  [0,1].forEach(i=>step(i,'idle','Chờ…'));
  fileName=f.name.replace(/\.[^.]+$/,'');
  log('Nhận file: '+f.name+' ('+(f.size/1048576).toFixed(2)+' MB)');
  const timer=setInterval(()=>{const e=$('#s0');if(e.dataset.st==='run')e.querySelector('span').textContent='… Đang chạy… '+Math.floor((performance.now()-T0)/1000)+' giây'+(gp?' · '+gp:'')},500);
  try{
    let buf=await f.arrayBuffer();const h=String.fromCharCode(...new Uint8Array(buf.slice(0,4)));
    if(h==='MThd'){
      step(0,'ok','Bỏ qua: file đã là MIDI');log('Phát hiện file MIDI, bỏ qua bước nhận dạng');
      parseMidi(buf);midiBytes=buf;$('#bMid').hidden=false;$('#name').value=fileName;
      await dbPut('midi',{blob:new Blob([buf],{type:'audio/midi'}),name:fileName,inst});
      log('Đọc được '+tracks.length+' track, '+tracks.reduce((a,t)=>a+t.notes.length,0)+' nốt');
      showTracks();ready();
    }else if(/\.(txt|json|skysheet)$/i.test(f.name)){
      throw new Error('Không còn hỗ trợ file Sky. Hãy dùng MP3, WAV, FLAC, M4A, OGG hoặc MIDI.');
    }else{
      step(0,'run','Đang chuẩn bị…');
      if(!window.mm)throw new Error('Không tải được thư viện Magenta, hãy kiểm tra kết nối internet.');
      try{await dbDel('midi')}catch(e){} /* tải bài mới thì xóa bài cũ */
      const isG=inst==='guitar',kind=isG?'guitar':'piano';let ns;
      if(isG)ns=await transcribeGuitar(buf,filt);
      else{
        if(!model){log('Tải mô hình Onsets and Frames (chỉ lần đầu, vài chục MB)…');const m=new mm.OnsetsAndFrames(CKPT);await m.initialize();model=m;log('Mô hình đã sẵn sàng','ok')}
        let src=f;
        if(FILT[filt]){log('Giải mã và lọc âm thanh trước khi nhận dạng…');const r=await cleanAudio(buf,filt);src=wav16(r.data,22050)}
        log('Giải mã âm thanh và nhận dạng nốt piano. Bước này có thể mất vài phút…');
        ns=await model.transcribeFromAudioFile(src);
      }
      if(isG||FILT[filt])ns=finishSeq(ns,kind,filt);
      if(!ns.notes.length)throw new Error('Không phát hiện nốt '+(isG?'guitar':'piano')+' nào trong file.');
      buf=null; /* bỏ dữ liệu âm thanh gốc, chỉ giữ nốt piano */
      midiBytes=mm.sequenceProtoToMidi(ns);$('#bMid').hidden=false;
      log('Nhận dạng xong: '+ns.notes.length+' nốt, dài '+ns.totalTime.toFixed(1)+' giây','ok');
      step(0,'ok',ns.notes.length+' nốt');
      /* Dọn dẹp: lưu MIDI rồi xóa MP3 đã lưu trước đó */
      try{
        await dbPut('midi',{blob:new Blob([midiBytes],{type:'audio/midi'}),name:fileName,inst});
        await dbDel('pending');
        log('Chỉ giữ nốt '+(isG?'guitar':'piano')+' (MIDI); đã bỏ nhạc gốc của video và xóa MP3 đã lưu','ok');
      }catch(e){log('Không dọn được dữ liệu lưu tạm: '+(e.message||e),'wr')}
      tracks=[{name:(isG?'Guitar':'Piano')+' nhận dạng từ '+f.name,notes:ns.notes.map(n=>({tick:(n.startTime||0)*1000,n:n.pitch,end:n.endTime*1000}))}];
      tempos=[{tick:0,us:1000000}];division=1000;
      $('#name').value=fileName;
      showTracks();ready();
    }
  }catch(e){
    const i=$('#s0').dataset.st==='run'?0:1;step(i,'err','Lỗi');log('Lỗi: '+(e.message||e),'err');
  }finally{clearInterval(timer)}
}
function ready(){step(1,'ok','Có thể nghe MIDI hoặc tải .mid');log('Hoàn tất: có thể nghe MIDI và tải file .mid','ok')}
document.querySelectorAll('.pinst').forEach(sl=>sl.addEventListener('change',()=>{document.querySelectorAll('.pinst').forEach(o=>o.value=sl.value);if(window.Tone)loadInst(sl.value)}));
log('Sẵn sàng. Chọn một file để bắt đầu.');
if(window.Tone)loadInst(pinst());else log('Không tải được Tone.js (cần internet).','err');

/* ---------- Tự nạp khi vào trang ----------
   Ưu tiên MP3 mới từ index.html; nếu không có thì mở lại MIDI đang giữ (không cần nhận dạng lại). */
(async()=>{
  try{
    const p=await dbGet('pending');
    if(p&&p.blob){log('Nhận MP3 từ trang tải: '+p.name);return load(new File([p.blob],p.name,{type:p.blob.type||'audio/mpeg'}),p.inst,p.filt)}
    const m=await dbGet('midi');
    if(m&&m.blob){log('Mở lại MIDI đang giữ: '+m.name);load(new File([m.blob],m.name+'.mid',{type:'audio/midi'}),m.inst)}
  }catch(e){log('Không đọc được dữ liệu lưu tạm: '+(e.message||e),'err')}
})();
